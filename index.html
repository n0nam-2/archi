<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 뷰포트 확대/축소 및 이동 완전 방지 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>건축학도 생존기: 크리틱을 피하라!</title>
  
  <!-- 동글동글한 글씨체 (Google Jua) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: 'Jua', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a202c;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh; 
      max-width: 480px;
      background-color: #ffffff;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    /* 상단 UI (점수 & 목숨) */
    #header-ui {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      color: #333333;
      z-index: 10;
      pointer-events: none;
    }

    .hearts {
      color: #e53e3e;
      font-size: 22px;
      letter-spacing: 3px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 시작 / 종료 팝업 화면 */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }

    .overlay h1 {
      font-size: 32px;
      color: #2d3748;
      margin-bottom: 12px;
    }

    .overlay p {
      font-size: 18px;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      padding: 14px 44px;
      font-size: 22px;
      background-color: #ff5722;
      color: #ffffff;
      border: none;
      border-radius: 40px;
      box-shadow: 0 5px 0 #d84315;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d84315;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="header-ui">
    <div id="score-text">생존 점수: 0</div>
    <div id="lives-text" class="hearts">❤️❤️❤️</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- 시작 화면 -->
  <div id="start-screen" class="overlay">
    <h1>📐 마감 지옥 탈출</h1>
    <p>
      화면 어디든 <b>손가락으로 터치해 좌우로 밀면</b><br>
      학생이 손가락을 따라 피합니다!<br><br>
      쏟아지는 <b>검은 크리틱 글자</b>를 피해 살아남으세요.<br>
      (3번 맞으면 즉시 F학점!)
    </p>
    <button id="start-btn" class="btn">마감 시작!</button>
  </div>

  <!-- 게임 오버 화면 -->
  <div id="gameover-screen" class="overlay hidden">
    <h1>💥 크리틱 폭격 완료</h1>
    <p id="final-score-text">최종 생존 점수: 0</p>
    <p style="font-size: 16px; color: #718096; margin-top: -12px;">
      "교수님: 다음 주에 처음부터 다시 설계해 오세요."
    </p>
    <button id="restart-btn" class="btn">다시 마감하기</button>
  </div>
</div>

<script>
  const container = document.getElementById('game-container');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const scoreText = document.getElementById('score-text');
  const livesText = document.getElementById('lives-text');
  const finalScoreText = document.getElementById('final-score-text');

  const CRITIC_WORDS = ["다시", "별론데?", "하...", "뭐야?"];

  let isPlaying = false;
  let score = 0;
  let lives = 3;
  let animationId = null;
  let spawnTimer = 0;
  let spawnInterval = 45;

  // 플레이어 (건축학과 학생)
  const player = {
    x: 0,
    y: 0,
    width: 52,
    height: 56
  };

  let obstacles = [];

  function resizeGame() {
    const width = container.clientWidth;
    const height = container.clientHeight;

    canvas.width = width;
    canvas.height = height;

    player.y = canvas.height - 95;

    if (!isPlaying) {
      player.x = (canvas.width - player.width) / 2;
    } else {
      if (player.x + player.width > canvas.width) {
        player.x = canvas.width - player.width;
      }
    }
  }

  window.addEventListener('resize', resizeGame);
  window.addEventListener('orientationchange', () => {
    setTimeout(resizeGame, 100);
  });
  resizeGame();

  function updatePlayerPosition(clientX) {
    const rect = canvas.getBoundingClientRect();
    const currentTouchX = clientX - rect.left;
    
    player.x = currentTouchX - player.width / 2;

    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) {
      player.x = canvas.width - player.width;
    }
  }

  // 모바일 터치 이벤트
  window.addEventListener('touchmove', (e) => {
    if (!isPlaying) return;
    if (e.touches.length > 0) {
      updatePlayerPosition(e.touches[0].clientX);
    }
  }, { passive: true });

  window.addEventListener('touchstart', (e) => {
    if (!isPlaying) return;
    if (e.touches.length > 0) {
      updatePlayerPosition(e.touches[0].clientX);
    }
  }, { passive: true });

  // 마우스 이벤트
  let isMouseDown = false;
  window.addEventListener('mousedown', (e) => {
    if (!isPlaying) return;
    isMouseDown = true;
    updatePlayerPosition(e.clientX);
  });
  window.addEventListener('mousemove', (e) => {
    if (!isPlaying || !isMouseDown) return;
    updatePlayerPosition(e.clientX);
  });
  window.addEventListener('mouseup', () => { isMouseDown = false; });

  // 건축학도 우는 일러스트
  function drawPlayer(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // 몸통
    ctx.fillStyle = '#1976d2';
    ctx.beginPath();
    ctx.roundRect(8, 30, 36, 26, [8, 8, 2, 2]);
    ctx.fill();

    // T자 삼각자
    ctx.strokeStyle = '#78909c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(3, 24);
    ctx.lineTo(3, 54);
    ctx.moveTo(-2, 27);
    ctx.lineTo(8, 27);
    ctx.stroke();

    // 얼굴
    ctx.fillStyle = '#ffecb3';
    ctx.beginPath();
    ctx.arc(26, 20, 19, 0, Math.PI * 2);
    ctx.fill();

    // 다크서클
    ctx.fillStyle = '#b0bec5';
    ctx.beginPath();
    ctx.arc(19, 21, 5, 0, Math.PI);
    ctx.arc(33, 21, 5, 0, Math.PI);
    ctx.fill();

    // 눈 (> <)
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(16, 17); ctx.lineTo(20, 19); ctx.lineTo(16, 22);
    ctx.moveTo(36, 17); ctx.lineTo(32, 19); ctx.lineTo(36, 22);
    ctx.stroke();

    // 우는 입
    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.arc(26, 27, 5.5, 0, Math.PI, false);
    ctx.fill();

    // 눈물
    ctx.fillStyle = '#00b0ff';
    ctx.fillRect(17, 22, 3.5, 12);
    ctx.beginPath();
    ctx.arc(18.7, 36, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillRect(32, 22, 3.5, 12);
    ctx.beginPath();
    ctx.arc(33.7, 36, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // [수정] 20px 크기로 작아진 검은색 크리틱 글자
  function drawObstacle(item) {
    ctx.save();
    ctx.font = '20px "Jua", sans-serif';
    ctx.fillStyle = '#000000';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(item.text, item.x, item.y);
    ctx.restore();
  }

  // [수정] 글자 크기에 맞춘 폭/높이 계산
  function spawnObstacle() {
    const text = CRITIC_WORDS[Math.floor(Math.random() * CRITIC_WORDS.length)];
    ctx.font = '20px "Jua", sans-serif';
    const textMetrics = ctx.measureText(text);
    
    const width = textMetrics.width;
    const height = 20; // 20px 폰트 높이
    const x = Math.random() * (canvas.width - width);
    const speed = 3.2 + Math.random() * 2 + Math.min(score / 400, 4.5);

    obstacles.push({ text, x, y: -height, width, height, speed });
  }

  // 글자 피격 판정
  function checkCollision(player, textObj) {
    const paddingX = 2;
    return (
      player.x < textObj.x + textObj.width - paddingX &&
      player.x + player.width > textObj.x + paddingX &&
      player.y < textObj.y + textObj.height &&
      player.y + player.height > textObj.y
    );
  }

  function update() {
    if (!isPlaying) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 모눈종이 배경
    ctx.strokeStyle = '#f0f0f0';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 30) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 30) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    score++;
    scoreText.innerText = `생존 점수: ${score}`;

    drawPlayer(player.x, player.y);

    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
      spawnObstacle();
      spawnTimer = 0;
      if (spawnInterval > 18 && score % 150 === 0) {
        spawnInterval--;
      }
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const item = obstacles[i];
      item.y += item.speed;
      drawObstacle(item);

      if (checkCollision(player, item)) {
        obstacles.splice(i, 1);
        lives--;
        updateLivesUI();

        if (lives <= 0) {
          gameOver();
          return;
        }
        continue;
      }

      if (item.y > canvas.height + 30) {
        obstacles.splice(i, 1);
      }
    }

    animationId = requestAnimationFrame(update);
  }

  function updateLivesUI() {
    let heartIcons = '';
    for (let i = 0; i < 3; i++) {
      heartIcons += (i < lives) ? '❤️' : '🖤';
    }
    livesText.innerText = heartIcons;
  }

  function startGame() {
    resizeGame();
    score = 0;
    lives = 3;
    spawnInterval = 45;
    spawnTimer = 0;
    obstacles = [];
    player.x = (canvas.width - player.width) / 2;

    updateLivesUI();
    scoreText.innerText = `생존 점수: 0`;

    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');

    isPlaying = true;
    if (animationId) cancelAnimationFrame(animationId);
    animationId = requestAnimationFrame(update);
  }

  function gameOver() {
    isPlaying = false;
    if (animationId) cancelAnimationFrame(animationId);
    finalScoreText.innerText = `최종 생존 점수: ${score}`;
    gameoverScreen.classList.remove('hidden');
  }

  startBtn.addEventListener('pointerdown', startGame);
  restartBtn.addEventListener('pointerdown', startGame);
</script>

</body>
</html>
