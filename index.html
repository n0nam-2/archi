<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>건축학도 생존기: 크리틱을 피하라!</title>
  
  <!-- 동글동글한 글씨체 (Google Jua) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: 'Jua', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a202c;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh; 
      max-width: 480px;
      background-color: #ffffff;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    /* 상단 UI (점수, 난이도, 목숨) */
    #header-ui {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .info-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #score-text {
      font-size: 20px;
      color: #333333;
    }

    #level-badge {
      font-size: 13px;
      padding: 2px 8px;
      border-radius: 12px;
      background-color: #e0e0e0;
      color: #424242;
      width: fit-content;
      transition: all 0.3s;
    }

    .hearts {
      color: #e53e3e;
      font-size: 22px;
      letter-spacing: 3px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }

    .overlay h1 {
      font-size: 32px;
      color: #2d3748;
      margin-bottom: 12px;
    }

    .overlay p {
      font-size: 18px;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      padding: 14px 44px;
      font-size: 22px;
      background-color: #ff5722;
      color: #ffffff;
      border: none;
      border-radius: 40px;
      box-shadow: 0 5px 0 #d84315;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d84315;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="header-ui">
    <div class="info-left">
      <div id="score-text">생존 점수: 0</div>
      <div id="level-badge">초기 크리틱</div>
    </div>
    <div id="lives-text" class="hearts">❤️❤️❤️</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="start-screen" class="overlay">
    <h1>📐 마감 지옥 탈출</h1>
    <p>
      화면 어디든 <b>손가락으로 터치해 좌우로 밀면</b><br>
      학생이 손가락을 따라 피합니다!<br><br>
      시간이 흐를수록 <b>교수님의 크리틱이 더욱 빨라지고<br>동시에 여러 개가 쏟아집니다!</b><br>
      (3번 맞으면 즉시 F학점!)
    </p>
    <button id="start-btn" class="btn">마감 시작!</button>
  </div>

  <div id="gameover-screen" class="overlay hidden">
    <h1>💥 크리틱 폭격 완료</h1>
    <p id="final-score-text">최종 생존 점수: 0</p>
    <p id="final-level-text" style="font-size: 15px; color: #e65100; margin-top: -16px; margin-bottom: 8px;"></p>
    <p style="font-size: 16px; color: #718096;">
      "교수님: 다음 주에 처음부터 다시 설계해 오세요."
    </p>
    <button id="restart-btn" class="btn">다시 마감하기</button>
  </div>
</div>

<script>
  const container = document.getElementById('game-container');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const scoreText = document.getElementById('score-text');
  const levelBadge = document.getElementById('level-badge');
  const livesText = document.getElementById('lives-text');
  const finalScoreText = document.getElementById('final-score-text');
  const finalLevelText = document.getElementById('final-level-text');

  const CRITIC_WORDS = ["다시", "별론데?", "하...", "뭐야?"];

  let isPlaying = false;
  let score = 0;
  let lives = 3;
  let animationId = null;
  let spawnTimer = 0;
  let currentStageName = "초기 크리틱";

  const player = {
    x: 0,
    y: 0,
    width: 52,
    height: 56
  };

  let obstacles = [];

  function resizeGame() {
    const width = container.clientWidth;
    const height = container.clientHeight;

    canvas.width = width;
    canvas.height = height;

    player.y = canvas.height - 95;

    if (!isPlaying) {
      player.x = (canvas.width - player.width) / 2;
    } else {
      if (player.x + player.width > canvas.width) {
        player.x = canvas.width - player.width;
      }
    }
  }

  window.addEventListener('resize', resizeGame);
  window.addEventListener('orientationchange', () => {
    setTimeout(resizeGame, 100);
  });
  resizeGame();

  function updatePlayerPosition(clientX) {
    const rect = canvas.getBoundingClientRect();
    const currentTouchX = clientX - rect.left;
    player.x = currentTouchX - player.width / 2;

    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) {
      player.x = canvas.width - player.width;
    }
  }

  window.addEventListener('touchmove', (e) => {
    if (!isPlaying) return;
    if (e.touches.length > 0) updatePlayerPosition(e.touches[0].clientX);
  }, { passive: true });

  window.addEventListener('touchstart', (e) => {
    if (!isPlaying) return;
    if (e.touches.length > 0) updatePlayerPosition(e.touches[0].clientX);
  }, { passive: true });

  let isMouseDown = false;
  window.addEventListener('mousedown', (e) => {
    if (!isPlaying) return;
    isMouseDown = true;
    updatePlayerPosition(e.clientX);
  });
  window.addEventListener('mousemove', (e) => {
    if (!isPlaying || !isMouseDown) return;
    updatePlayerPosition(e.clientX);
  });
  window.addEventListener('mouseup', () => { isMouseDown = false; });

  function drawPlayer(x, y) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#1976d2';
    ctx.beginPath();
    ctx.roundRect(8, 30, 36, 26, [8, 8, 2, 2]);
    ctx.fill();

    ctx.strokeStyle = '#78909c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(3, 24);
    ctx.lineTo(3, 54);
    ctx.moveTo(-2, 27);
    ctx.lineTo(8, 27);
    ctx.stroke();

    ctx.fillStyle = '#ffecb3';
    ctx.beginPath();
    ctx.arc(26, 20, 19, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#b0bec5';
    ctx.beginPath();
    ctx.arc(19, 21, 5, 0, Math.PI);
    ctx.arc(33, 21, 5, 0, Math.PI);
    ctx.fill();

    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(16, 17); ctx.lineTo(20, 19); ctx.lineTo(16, 22);
    ctx.moveTo(36, 17); ctx.lineTo(32, 19); ctx.lineTo(36, 22);
    ctx.stroke();

    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.arc(26, 27, 5.5, 0, Math.PI, false);
    ctx.fill();

    ctx.fillStyle = '#00b0ff';
    ctx.fillRect(17, 22, 3.5, 12);
    ctx.beginPath();
    ctx.arc(18.7, 36, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillRect(32, 22, 3.5, 12);
    ctx.beginPath();
    ctx.arc(33.7, 36, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawObstacle(item) {
    ctx.save();
    ctx.font = '20px "Jua", sans-serif';
    ctx.fillStyle = '#000000';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(item.text, item.x, item.y);
    ctx.restore();
  }

  // 1개 단어 개체 생성
  function createSingleObstacle() {
    const text = CRITIC_WORDS[Math.floor(Math.random() * CRITIC_WORDS.length)];
    ctx.font = '20px "Jua", sans-serif';
    const textMetrics = ctx.measureText(text);
    const width = textMetrics.width;
    const height = 20;
    const x = Math.random() * (canvas.width - width);
    
    // 기본 속도 + 점수 비례 가속 (최대 11.0까지 점진적 상승)
    const speed = 3.5 + Math.random() * 2.0 + Math.min(score / 250, 5.5);

    return { text, x, y: -height, width, height, speed };
  }

  // 시간에 따라 스폰 개수 결정
  function spawnObstacles() {
    // 800점 이상: 40% 확률로 2개 동시 생성
    // 1600점 이상: 3개까지 다중 생성 가능
    let count = 1;
    if (score > 1600) {
      count = Math.random() < 0.5 ? 3 : 2;
    } else if (score > 800) {
      count = Math.random() < 0.4 ? 2 : 1;
    }

    for (let i = 0; i < count; i++) {
      obstacles.push(createSingleObstacle());
    }
  }

  function checkCollision(player, textObj) {
    const paddingX = 2;
    return (
      player.x < textObj.x + textObj.width - paddingX &&
      player.x + player.width > textObj.x + paddingX &&
      player.y < textObj.y + textObj.height &&
      player.y + player.height > textObj.y
    );
  }

  function update() {
    if (!isPlaying) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#f0f0f0';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 30) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 30) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    score++;
    scoreText.innerText = `생존 점수: ${score}`;

    // 점수에 따른 난이도 단계 및 주기 계산
    let currentInterval = 46;
    if (score < 400) {
      currentStageName = "단계: ☕ 온화한 피드백";
      levelBadge.style.backgroundColor = "#e8f5e9";
      levelBadge.style.color = "#2e7d32";
      currentInterval = Math.max(36, 46 - Math.floor(score / 50));
    } else if (score < 1000) {
      currentStageName = "단계: ⚡ 날카로운 지적";
      levelBadge.style.backgroundColor = "#fff3e0";
      levelBadge.style.color = "#e65100";
      currentInterval = Math.max(26, 36 - Math.floor((score - 400) / 70));
    } else if (score < 1800) {
      currentStageName = "단계: 🔥 연속 크리틱 폭격";
      levelBadge.style.backgroundColor = "#ffebee";
      levelBadge.style.color = "#c62828";
      currentInterval = Math.max(18, 26 - Math.floor((score - 1000) / 90));
    } else {
      currentStageName = "단계: ☠️ 마감 직전 멘붕";
      levelBadge.style.backgroundColor = "#212121";
      levelBadge.style.color = "#ff5252";
      currentInterval = 14; // 초고속 낙하
    }
    levelBadge.innerText = currentStageName;

    drawPlayer(player.x, player.y);

    spawnTimer++;
    if (spawnTimer >= currentInterval) {
      spawnObstacles();
      spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const item = obstacles[i];
      item.y += item.speed;
      drawObstacle(item);

      if (checkCollision(player, item)) {
        obstacles.splice(i, 1);
        lives--;
        updateLivesUI();

        if (lives <= 0) {
          gameOver();
          return;
        }
        continue;
      }

      if (item.y > canvas.height + 30) {
        obstacles.splice(i, 1);
      }
    }

    animationId = requestAnimationFrame(update);
  }

  function updateLivesUI() {
    let heartIcons = '';
    for (let i = 0; i < 3; i++) {
      heartIcons += (i < lives) ? '❤️' : '🖤';
    }
    livesText.innerText = heartIcons;
  }

  function startGame() {
    resizeGame();
    score = 0;
    lives = 3;
    spawnTimer = 0;
    obstacles = [];
    player.x = (canvas.width - player.width) / 2;

    updateLivesUI();
    scoreText.innerText = `생존 점수: 0`;

    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');

    isPlaying = true;
    if (animationId) cancelAnimationFrame(animationId);
    animationId = requestAnimationFrame(update);
  }

  function gameOver() {
    isPlaying = false;
    if (animationId) cancelAnimationFrame(animationId);
    finalScoreText.innerText = `최종 생존 점수: ${score}`;
    finalLevelText.innerText = `도달 수준: ${currentStageName.replace('단계: ', '')}`;
    gameoverScreen.classList.remove('hidden');
  }

  startBtn.addEventListener('pointerdown', startGame);
  restartBtn.addEventListener('pointerdown', startGame);
</script>

</body>
</html>
